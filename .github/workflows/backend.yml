name: Backend CI

on:
  pull_request:
    paths:
      - "src/app/api/**"
      - "src/lib/**"
      - "test/**"
      - "docs/openapi.yaml"
      - "scripts/check-openapi-coverage.mjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "bun.lock"
      - "next.config.mjs"
      - "eslint.config.mjs"
      - "jsconfig.json"
      - ".github/workflows/backend.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "src/app/api/**"
      - "src/lib/**"
      - "test/**"
      - "docs/openapi.yaml"
      - "scripts/check-openapi-coverage.mjs"
      - "package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"
      - "bun.lock"
      - "next.config.mjs"
      - "eslint.config.mjs"
      - "jsconfig.json"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    name: Lint, Test & Build Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      mongodb:
        image: mongo:7
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017
    env:
      MONGODB_URI: mongodb://localhost:27017/scholarmarket-ci
      MONGODB_DB: scholarmarket-ci
      JWT_SECRET: ci-jwt-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_GATEWAY_URL: https://gateway.pinata.cloud
      PINATA_JWT: ci-pinata-token
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ci-walletconnect-project-id
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Check OpenAPI coverage
        run: node scripts/check-openapi-coverage.mjs

      - name: Lint backend
        run: npm run lint --if-present -- src/app/api src/lib

      - name: Run backend tests
        run: npm run test:backend --if-present

      - name: Run integration tests
        run: npm run test:integration --if-present

      - name: Build application
        run: npm run build --if-present
